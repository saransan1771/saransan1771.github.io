<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゲームプレイヤー</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #1a1a1a;
      color: #fff;
    }

    /* 上部の操作バー */
    .controls {
      padding: 12px 16px;
      background-color: #2a2a2a;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #444;
      z-index: 10;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    select {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #555;
      background-color: #333;
      color: #fff;
      cursor: pointer;
      min-width: 220px;
    }

    select:focus {
      outline: none;
      border-color: #007bff;
    }

    /* ゲーム表示・初期メッセージ領域 */
    .player-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background-color: #000;
    }

    /* 中央メッセージのスタイル */
    .placeholder-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      font-weight: bold;
      color: #aaa;
      text-align: center;
      pointer-events: none; /* メッセージの背後への操作を邪魔しない */
      white-space: nowrap;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 操作バー -->
  <div id="controls" class="controls">
    <label for="htmlSelect">ゲームを選択:</label>
    <select id="htmlSelect" onchange="loadSelectedHtml()">
      <!-- 初期状態（未選択） -->
      <option value="" disabled selected>-- ゲームを選んでください --</option>
      <!-- ここにゲームのHTMLファイルを指定します -->
      <option value="game1.html">Lane Defander</option>
      <option value="game2.html">生態系観察シミュ</option>
      <option value="game3.html">ゲーム 3</option>
    </select>
  </div>

  <!-- 表示エリア -->
  <div class="player-container">
    <!-- 中央に表示されるメッセージ -->
    <div id="placeholder" class="placeholder-message">
      遊びたいゲームを左上から選択してください
    </div>
    <!-- ゲーム画面（初期状態では何も読み込まない） -->
    <iframe id="playerFrame" src="" allow="fullscreen"></iframe>
  </div>

  <script>
    function loadSelectedHtml() {
      const selectElement = document.getElementById('htmlSelect');
      const frame = document.getElementById('playerFrame');
      const placeholder = document.getElementById('placeholder');
      const controls = document.getElementById('controls');

      if (selectElement.value) {
        // 選択されたらiframeにURLを設定
        frame.src = selectElement.value;
        // 中央メッセージを非表示にする
        placeholder.style.display = 'none';
        // 上部の操作バーを非表示にする
        controls.style.display = 'none';
      }
    }
  </script>

</body>
</html>
